services:
  nobis.supervisor:
    image: ghcr.io/malexxx/nobis.supervisor:latest
    container_name: nobis.supervisor
    restart: unless-stopped
    ports:
      - "5540:5540/udp"
      # Accès HTTP direct conservé en secours sur le port 1220 (boucle locale uniquement) :
      - "127.0.0.1:1220:8080"
    volumes:
      - nobis_data:/app/data
    environment:
      - TZ=Europe/Paris
      - DB_PATH=/app/data/nobis_a10.db
      - HTTPS_DEFAULT_MODE=http
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-127.0.0.1,::1,172.16.0.0/12}
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN:?Definissez WATCHTOWER_TOKEN (ex: openssl rand -hex 24) dans votre fichier .env}

  caddy:
    image: caddy:alpine
    container_name: nobis.caddy
    restart: unless-stopped
    ports:
      - "1221:1221"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nobis.supervisor

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 3600 --cleanup --http-api-update --http-api-token ${WATCHTOWER_TOKEN:?Definissez WATCHTOWER_TOKEN dans votre fichier .env} nobis.supervisor

volumes:
  nobis_data:
  caddy_data:
  caddy_config:
