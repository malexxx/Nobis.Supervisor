services:
  nobis.supervisor:
    image: ghcr.io/malexxx/nobis.supervisor:latest
    container_name: nobis.supervisor
    restart: unless-stopped
    ports:
      - "5540:5540/udp"
      # Accès HTTP direct conservé en secours sur le port 1220 (boucle locale uniquement) :
      - "127.0.0.1:1220:8080"
    volumes:
      - /volume1/docker/nobis.supervisor/data:/app/data
    environment:
      - TZ=Europe/Paris
      - DB_PATH=/app/data/nobis_a10.db

  caddy:
    image: caddy:alpine
    container_name: nobis.caddy
    restart: unless-stopped
    ports:
      - "1221:1221"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /volume1/docker/nobis.supervisor/caddy_data:/data
      - /volume1/docker/nobis.supervisor/caddy_config:/config
    depends_on:
      - nobis.supervisor

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 3600 --cleanup nobis.supervisor
