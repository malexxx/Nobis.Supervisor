<!DOCTYPE html>
<html lang="fr" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO & Référencement -->
  <title>Nobis.Supervisor — Cockpit & Passerelle Matter pour Poêles Nobis / Micronova</title>
  <meta name="description"
    content="Supervision haute fidélité, tableau de bord télémétrique et passerelle Matter locale pour poêles à granulés Nobis et cartes mères Micronova (Agua IoT)." />
  <meta name="keywords"
    content="Nobis, poêle granulés, Micronova, Agua IoT, Matter, Home Assistant, domotique, cockpit, pellet, smart home" />
  <meta name="author" content="Nobis.Supervisor" />

  <!-- Open Graph / Facebook / Discord / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Nobis.Supervisor — Cockpit Poêle à Granulés Nobis & Micronova" />
  <meta property="og:description"
    content="Supervision haute fidélité, télémétrie locale en temps réel et pont Matter compatible Apple Home, Google Home et Home Assistant." />
  <meta property="og:image"
    content="https://raw.githubusercontent.com/malexxx/Nobis.Supervisor/main/docs/screenshots/cockpit_triarc_v1.0.png" />
  <meta property="og:image:alt" content="Interface Cockpit Tri-Arc Nobis.Supervisor" />
  <meta property="og:locale" content="fr_FR" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Nobis.Supervisor — Cockpit Poêle à Granulés Nobis & Micronova" />
  <meta name="twitter:description"
    content="Supervision haute fidélité, télémétrie locale en temps réel et pont Matter compatible Apple Home, Google Home et Home Assistant." />
  <meta name="twitter:image"
    content="https://raw.githubusercontent.com/malexxx/Nobis.Supervisor/main/docs/screenshots/cockpit_triarc_v1.0.png" />

  <!-- Mode Application Native Plein Écran (PWA iOS & Android) -->
  <meta name="theme-color" content="#0b0f19" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nobis.Supervisor" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <link rel="stylesheet" href="/static/css/tailwind.generated.css?v=2.1.2" />
  <link rel="stylesheet" href="/static/css/styles.css?v=2.1.2" />
  <script defer src="/static/vendor/chart.umd.min.js?v=2.1.2"></script>
</head>

<body class="min-h-screen flex flex-col pb-28 md:pb-6">

  <!-- TOAST NOTIFICATION FLOTTANTE -->
  <div id="toast-box"
    class="fixed bottom-24 md:bottom-5 right-4 z-50 hidden px-4 py-2.5 rounded-xl shadow-2xl border text-xs font-semibold flex items-center gap-2 transition-all">
  </div>

<!-- @include partials/modals.html -->
  <!-- HEADER PRINCIPAL ÉPURÉ -->
  <header
    class="bg-gray-900/95 backdrop-blur border-b border-gray-800 px-3 sm:px-6 py-2 flex items-center justify-between gap-2">
    <!-- GAUCHE : Météo Extérieure Cliquable -->
    <div class="flex items-center gap-2 sm:gap-3">
      <button type="button" onclick="openWeatherModal()"
        class="flex items-center gap-1.5 text-xs bg-gray-950/80 hover:bg-gray-800/90 border border-gray-800 hover:border-sky-500/60 px-2.5 py-1.5 rounded-lg shadow-inner transition cursor-pointer"
        title="Conditions météo extérieures • Cliquer pour afficher les données recueillies">
        <span class="text-sm">🌦️</span>
        <div class="flex items-baseline gap-1.5">
          <span class="font-bold text-sky-400 tabular-nums"><span id="kpi-w-t">--</span>°C</span>
          <span class="text-gray-400 text-[11px] hidden sm:inline">
            (<b id="kpi-w-h" class="text-gray-300 font-normal">--</b>% • <b id="kpi-w-w"
              class="text-gray-300 font-normal">--</b> km/h)
          </span>
        </div>
      </button>
    </div>

    <!-- CENTRE : Autonomie du Poêle (Stock % uniquement) -->
    <div onclick="switchTab('tab-pellets')"
      class="flex items-center gap-1.5 bg-gray-950/85 hover:bg-gray-850 border border-gray-800 hover:border-amber-500/60 px-2.5 sm:px-3 py-1.5 rounded-lg text-xs cursor-pointer transition shadow-inner select-none"
      title="Stock de granulés • Cliquer pour afficher le détail Pellets">
      <span class="text-sm">🪵</span>
      <span id="hdr-pellet-hopper" class="font-bold text-amber-400 text-xs sm:text-sm tabular-nums">--%</span>
    </div>

    <!-- DROITE : Pilule unifiée Mode de connexion + Picto Docker -->
    <div id="hdr-conn-group" class="flex items-center justify-end flex-shrink-0">
      <div id="hdr-status-pill" onclick="openConfigModal()"
        class="flex items-center gap-1.5 px-2.5 py-1 sm:py-1.5 rounded-xl border bg-emerald-950/60 border-emerald-500/70 shadow-[0_0_10px_rgba(16,185,129,0.25)] cursor-pointer transition-all duration-200 hover:brightness-110"
        title="Conteneur Nobis.Supervisor • Cliquer pour ouvrir les réglages">
        <button type="button" id="hdr-mode-conn-btn" onclick="event.stopPropagation(); pollNow();"
          class="flex items-center justify-center text-emerald-400 hover:scale-110 transition-transform cursor-pointer"
          title="Liaison active • Cliquer pour forcer l'actualisation">
          <span id="hdr-mode-conn-icon" class="flex items-center justify-center w-4 h-4 sm:w-[18px] sm:h-[18px]">
            <svg viewBox="0 0 24 24" class="w-4 h-4 sm:w-[18px] sm:h-[18px]" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" />
            </svg>
          </span>
        </button>
        <span class="w-px h-3.5 bg-gray-700/80"></span>
        <span id="hdr-container-version"
          class="flex items-center justify-center w-4 h-4 sm:w-[18px] sm:h-[18px] text-emerald-400"
          title="Conteneur Docker Nobis.Supervisor">
          <svg viewBox="0 0 24 24" class="w-4 h-4 sm:w-[18px] sm:h-[18px]" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 13.5h15.5c1.5 0 2.8-.8 3.5-2.1-.7-.5-1.6-.6-2.4-.3.2-.9-.1-1.9-.9-2.5-.8.7-1.1 1.8-.8 2.8-.6.4-1.4.6-2.2.6H2v1.5z" />
            <path d="M3 13.5c0 3.6 2.8 6 7 6 4.7 0 8.2-2.2 9.8-6" />
            <rect x="4.5" y="9.5" width="2.5" height="2" rx="0.3" />
            <rect x="7.8" y="9.5" width="2.5" height="2" rx="0.3" />
            <rect x="11.1" y="9.5" width="2.5" height="2" rx="0.3" />
            <rect x="7.8" y="6.8" width="2.5" height="2" rx="0.3" />
            <rect x="11.1" y="6.8" width="2.5" height="2" rx="0.3" />
          </svg>
        </span>
      </div>
    </div>
  </header>

  <!-- ===================================================================== -->
  <!-- BARRE DE NAVIGATION PC (5 ONGLETS FUSIONNÉS : PILOTAGE, PELLETS, ETC.) -->
  <!-- ===================================================================== -->
  <nav class="hidden md:flex justify-center bg-gray-900/70 border-b border-gray-800 px-6 overflow-x-auto text-sm">
    <button onclick="switchTab('tab-control')" id="btn-tab-control"
      class="px-5 py-3 tab-active whitespace-nowrap flex items-center gap-2">
      <span>🎮</span><span>Pilotage</span>
    </button>
    <button onclick="switchTab('tab-pellets')" id="btn-tab-pellets"
      class="px-5 py-3 text-gray-400 hover:text-white whitespace-nowrap flex items-center gap-2">
      <span>🪵</span><span>Pellets</span>
    </button>
    <button onclick="switchTab('tab-chrono')" id="btn-tab-chrono"
      class="px-5 py-3 text-gray-400 hover:text-white whitespace-nowrap flex items-center gap-2">
      <span>🕒</span><span>Programmation</span>
    </button>
    <button onclick="switchTab('tab-dashboard')" id="btn-tab-dashboard"
      class="px-5 py-3 text-gray-400 hover:text-white whitespace-nowrap flex items-center gap-2">
      <span>📊</span><span>Supervision</span>
    </button>
    <button onclick="switchTab('tab-installer')" id="btn-tab-installer"
      class="px-5 py-3 text-gray-400 hover:text-white whitespace-nowrap flex items-center gap-2">
      <span>🔧</span><span>Paramètres & Logs</span>
    </button>
  </nav>

  <!-- ===================================================================== -->
  <!-- BOTTOM APP BAR SUR SMARTPHONE (5 BOUTONS ÉPURÉS SANS LIBELLÉ)        -->
  <!-- ===================================================================== -->
  <nav
    class="fixed bottom-0 left-0 right-0 z-40 md:hidden backdrop-blur-md bg-gray-900/95 border-t border-gray-800 grid grid-cols-5 py-1 px-1 text-[11px] pb-[env(safe-area-inset-bottom,4px)]">
    <button onclick="switchTab('tab-control')" id="mob-btn-tab-control"
      class="flex flex-col items-center justify-center h-14 min-h-[56px] py-1 mob-tab-active" title="Pilotage">
      <span class="text-2xl">🎮</span>
    </button>
    <button onclick="switchTab('tab-pellets')" id="mob-btn-tab-pellets"
      class="flex flex-col items-center justify-center h-14 min-h-[56px] py-1 text-gray-400" title="Pellets">
      <span class="text-2xl">🪵</span>
    </button>
    <button onclick="switchTab('tab-chrono')" id="mob-btn-tab-chrono"
      class="flex flex-col items-center justify-center h-14 min-h-[56px] py-1 text-gray-400" title="Programmation">
      <span class="text-2xl">🕒</span>
    </button>
    <button onclick="switchTab('tab-dashboard')" id="mob-btn-tab-dashboard"
      class="flex flex-col items-center justify-center h-14 min-h-[56px] py-1 text-gray-400" title="Supervision">
      <span class="text-2xl">📊</span>
    </button>
    <button onclick="switchTab('tab-installer')" id="mob-btn-tab-installer"
      class="flex flex-col items-center justify-center h-14 min-h-[56px] py-1 text-gray-400" title="Paramètres & Logs">
      <span class="text-2xl">🔧</span>
    </button>
  </nav>

  <!-- CONTENU PRINCIPAL -->
  <main class="flex-1 px-1.5 pt-2 pb-28 md:pb-6 sm:p-6 max-w-[1650px] w-full mx-auto space-y-6">

<!-- @include partials/tab_control.html -->
<!-- @include partials/tab_pellets.html -->
<!-- @include partials/tab_chrono.html -->
<!-- @include partials/tab_dashboard.html -->
    <!-- =================================================================== -->
    <!-- ONGLET 5 : PARAMÈTRES, TARAGES & OBSERVABILITÉ                       -->
    <!-- =================================================================== -->
    <section id="tab-installer" class="hidden space-y-3.5 pb-8 md:pb-0 max-w-4xl mx-auto">

      <!-- EN-TÊTE COMPACT + RECHERCHE INSTANTANÉE -->
      <div class="card p-3 sm:p-4 bg-gray-900/90 border border-gray-800 shadow-xl backdrop-blur-md space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2.5">
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-orange-600/20 border border-orange-500/30 flex items-center justify-center text-lg shadow-inner shrink-0">
              🔧
            </div>
            <div>
              <div class="flex flex-wrap items-center gap-2">
                <h2 class="text-sm sm:text-base font-bold text-white tracking-wide">Paramètres &amp; Observabilité</h2>
                <span id="hdr-docker-version-badge"
                  class="text-[10px] font-mono font-semibold px-2 py-0.5 rounded-full bg-purple-950/80 text-purple-300 border border-purple-700/60"
                  title="Version de l'image Docker Nobis.Supervisor utilisée">
                  🐳 Docker v2.1.2
                </span>
                <span id="installer-auth-pill"
                  class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-gray-800 text-gray-400 border border-gray-700 flex items-center gap-1">
                  <span class="w-1.5 h-1.5 rounded-full bg-gray-400"></span><span id="installer-auth-pill-text">Expert Verrouillé</span>
                </span>
              </div>
              <p class="text-[11px] text-gray-400">Touchez une section pour l'ouvrir — un seul bloc reste déplié à la fois</p>
            </div>
          </div>
        </div>

        <!-- Barre de recherche rapide -->
        <div class="relative flex items-center bg-gray-950/90 border border-gray-800 focus-within:border-orange-500/70 rounded-xl px-3 py-2 transition">
          <span class="text-xs mr-2 text-gray-400">🔍</span>
          <input id="settings-acc-search" type="text"
            placeholder="Rechercher un réglage (ex: SX, DX, Matter, Météo, Granulés, Tarage, Logs...)"
            oninput="filterSettingsAccordions(this.value)"
            class="flex-1 bg-transparent text-xs sm:text-sm text-white placeholder-gray-500 outline-none" />
          <button id="settings-acc-search-clear" type="button"
            onclick="const inp=document.getElementById('settings-acc-search'); if(inp){inp.value='';} filterSettingsAccordions('');"
            class="hidden text-xs text-gray-400 hover:text-white px-1.5 cursor-pointer" title="Effacer la recherche">✕</button>
        </div>
      </div>

      <!-- MESSAGE SI AUCUN RÉSULTAT DE RECHERCHE -->
      <div id="settings-acc-empty" class="hidden card p-6 text-center text-xs text-gray-400">
        Aucun bloc de paramètres ne correspond à votre recherche.
      </div>

<!-- @include partials/tab_settings_general.html -->
<!-- @include partials/tab_settings_system.html -->    </section>

  </main>

  <script defer src="/static/js/features/pellets_ai.js?v=2.1.2"></script>

  <script defer src="/static/js/features/installer.js?v=2.1.2"></script>

  <script defer src="/static/js/features/tls.js?v=2.1.2"></script>

  <script defer src="/static/js/app.js?v=2.1.2"></script>
</body>

</html>
