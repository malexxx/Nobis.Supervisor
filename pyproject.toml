[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*httpx.*:UserWarning",
    "ignore:.*starlette.*:Warning",
]

[tool.coverage.run]
omit = [
    "benchmark_rpm.py",
    "app/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "except ImportError:",
]

[tool.mutmut]
paths_to_mutate = "analytics.py"
backup = false
runner = ".venv\\Scripts\\python.exe -m pytest -x -q tests/test_analytics.py"
tests_dir = "tests"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    ".node",
    "__pycache__",
    "data"
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes (variables non définies, syntaxe, imports cassés)
]
ignore = [
    "E501",   # line-too-long
    "E402",   # module level import not at top (nécessaire pour sys.path.insert(0, BASE_DIR))
]
